<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" id="themeColor" content="#f4f4f5">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reflex">
<title>Reflex</title>
<style>
  /* Reflex on the phone. The Mac app's language: quiet neutral surfaces
     (Raycast's recipe: the text colour at low opacity for fills and hairlines),
     one status colour per state, motion that is fast, ease-out, and never
     replayed by a refresh. */
  :root {
    --bg: #f4f4f5; --surface: #ffffff; --raise: rgba(0,0,0,.04); --line: rgba(0,0,0,.08); --hair: rgba(0,0,0,.06);
    --ink: #16161a; --ink2: rgba(22,22,26,.62); --ink3: rgba(22,22,26,.4);
    --blue: #3b6cf6; --amber: #e08a00; --green: #1f9d5c; --grey: #9a9aa2; --violet: #7c5cf0; --red: #e5484d;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --out: cubic-bezier(0.23, 1, 0.32, 1);
    --r: 16px;
    --vvh: 100dvh;
  }
  /* Dark: by the phone's setting (System), or chosen in Appearance. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0c0d; --surface: #171719; --raise: rgba(255,255,255,.05); --line: rgba(255,255,255,.09); --hair: rgba(255,255,255,.06);
      --ink: #ededef; --ink2: rgba(237,237,239,.6); --ink3: rgba(237,237,239,.38);
      --blue: #6e94ff; --amber: #ffb224; --green: #3dd68c; --grey: #6f6f78; --violet: #a58bff;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
      --bg: #0c0c0d; --surface: #171719; --raise: rgba(255,255,255,.05); --line: rgba(255,255,255,.09); --hair: rgba(255,255,255,.06);
      --ink: #ededef; --ink2: rgba(237,237,239,.6); --ink3: rgba(237,237,239,.38);
      --blue: #6e94ff; --amber: #ffb224; --green: #3dd68c; --grey: #6f6f78; --violet: #a58bff;
      --shadow: none; color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--ink); background: var(--bg); font: 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(.97); }
  button { transition: transform .12s var(--out), background-color .15s var(--out), opacity .15s var(--out); }

  /* ---------- home ---------- */
  .home { max-width: 640px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
  .top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px;
    margin: 0 -16px; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5); }
  .top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .chip { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 99px;
    background: var(--raise); color: var(--ink2); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip.bad { color: var(--amber); }
  .section { margin-top: 18px; }
  .section > .label { display: flex; align-items: baseline; gap: 6px; padding: 0 4px 8px; font-size: 13px; font-weight: 600; color: var(--ink2); }
  .section > .label .n { color: var(--ink3); font-variant-numeric: tabular-nums; font-weight: 500; }
  .section > .label .act { margin-left: auto; color: var(--ink3); font-weight: 500; font-size: 13px; }
  .group { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden;
    border: 1px solid var(--hair); }
  .row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 10px 14px; text-align: left; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 46px; right: 0; height: 1px; background: var(--hair); }
  .row:active { transform: none; background: var(--raise); }
  .row .text { flex: 1; min-width: 0; }
  .row .t1 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.005em; }
  .row .t2 { margin-top: 1px; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .gist { margin-top: 4px; font-size: 13px; line-height: 1.38; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .side { color: var(--ink3); font-size: 12.5px; font-variant-numeric: tabular-nums; flex: none; align-self: flex-start; padding-top: 2px; }
  .chev { width: 8px; height: 13px; flex: none; opacity: .3; }
  .x { flex: none; width: 30px; height: 30px; margin: -4px -6px -4px 0; border-radius: 99px; display: grid; place-items: center; color: var(--ink3); align-self: flex-start; }
  .x:active { background: var(--raise); }

  /* status glyphs, as on the Mac */
  .g { width: 20px; height: 20px; flex: none; display: grid; place-items: center; }
  .g i { display: block; width: 9px; height: 9px; border-radius: 50%; background: var(--grey); }
  .g.working i { width: 14px; height: 14px; background: none; border: 2px solid color-mix(in srgb, var(--blue) 22%, transparent);
    border-top-color: var(--blue); animation: spin .9s linear infinite; }
  .g.blocked i { background: var(--amber); box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 22%, transparent); }
  .g.done i { background: var(--green); }
  .g.idle i { background: none; border: 1.5px solid var(--grey); width: 10px; height: 10px; }
  .g.route i { background: var(--violet); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* questions */
  .q { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--hair); padding: 14px 14px 8px; }
  .q + .q { margin-top: 10px; }
  .q .head { display: flex; align-items: center; gap: 10px; }
  .q .who { flex: 1; min-width: 0; }
  .q .who b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q .who span { font-size: 13px; color: var(--ink2); }
  .q .open { font-size: 13px; font-weight: 600; color: var(--blue); padding: 6px 2px 6px 8px; }
  .q .gist { margin: 10px 0 4px; font-size: 13.5px; line-height: 1.42; color: var(--ink2); white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .opts { margin: 8px -6px 0; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 6px; border-radius: 12px; text-align: left; font-size: 15px; }
  .opt:active { background: var(--raise); transform: none; }
  .key { flex: none; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 8px; display: grid; place-items: center;
    font: 600 13px/1 var(--sans); font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--amber) 16%, transparent); color: var(--amber); }
  .q.route .key { background: color-mix(in srgb, var(--violet) 16%, transparent); color: var(--violet); }
  .sent { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; color: var(--ink2); }

  .empty { padding: 26px 16px; text-align: center; color: var(--ink2); font-size: 14px; }
  .empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
  .allclear { display: flex; align-items: center; gap: 12px; padding: 14px; }
  .allclear svg { flex: none; color: var(--green); }
  .allclear b { display: block; font-size: 15px; }
  .allclear span { font-size: 13px; color: var(--ink2); }
  .activity { padding: 4px 4px 0; }
  .activity div { font-size: 12.5px; color: var(--ink3); padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .activity .bad { color: var(--red); }

  /* the composer */
  .dock { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5); }
  .compose { max-width: 640px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 24px; padding: 5px 5px 5px 16px; box-shadow: var(--shadow); }
  .compose textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: none; color: var(--ink); font: 16px/1.35 var(--sans);
    padding: 8px 0; max-height: 132px; }
  .compose textarea::placeholder { color: var(--ink3); }
  .send { flex: none; width: 36px; height: 36px; border-radius: 99px; display: grid; place-items: center; background: var(--ink); color: var(--bg); }
  .send:disabled { opacity: .18; }
  .toast { max-width: 640px; margin: 0 auto 8px; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 14px; animation: rise .22s var(--out) both; }
  .toast span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button { font-weight: 600; color: var(--blue); padding: 4px 2px; }
  .toast.bad span { color: var(--red); }
  .new { animation: rise .24s var(--out) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .lock { min-height: 80dvh; display: grid; place-items: center; text-align: center; color: var(--ink2); padding: 24px; }
  .lock b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }

  /* ---------- a session ---------- */
  .session { --ov: rgba(255,255,255,.08); --ov2: rgba(255,255,255,.18); --edge: rgba(255,255,255,.07);
    --chrome: color-mix(in srgb, var(--term-bg, #1a1b26) 88%, #000); }
  .session[data-term="light"] { --ov: rgba(0,0,0,.06); --ov2: rgba(0,0,0,.13); --edge: rgba(0,0,0,.09);
    --chrome: color-mix(in srgb, var(--term-bg, #e1e2e7) 94%, #000); }
  .session { position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: var(--vvh); display: flex; flex-direction: column;
    background: var(--term-bg, #1a1b26); color: var(--term-fg, #c0caf5);
    transform: translateX(100%); visibility: hidden; transition: transform .28s var(--out), visibility 0s linear .28s; }
  .session.on { transform: none; visibility: visible; transition: transform .28s var(--out); }
  .bar { display: flex; align-items: center; gap: 4px; padding: calc(env(safe-area-inset-top) + 6px) 8px 8px;
    background: var(--chrome); border-bottom: 1px solid var(--edge); }
  .bar .back { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 99px; }
  .bar .back:active, .bar .more:active { background: var(--ov); }
  .bar .title { flex: 1; min-width: 0; text-align: center; }
  .bar .title b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .title span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; opacity: .65; }
  .bar .title .g { width: 12px; height: 12px; }
  .bar .title .g i { width: 7px; height: 7px; }
  .bar .title .g.working i { width: 10px; height: 10px; border-width: 1.5px; }
  .bar .more { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 99px; }
  .term { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; padding: 10px 10px 14px; overscroll-behavior: contain; }
  .term pre { margin: 0; font: var(--fs, 11px)/1.36 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 8; font-variant-ligatures: none; }
  .term.fit pre { white-space: pre; overflow-wrap: normal; line-height: 1.3; }
  .term.typing { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--blue) 55%, transparent); }
  /* A terminal the phone sized: xterm.js fills it, and swipes go to herdr. */
  .term { position: relative; }
  .term .xt, .term .touch { display: none; position: absolute; inset: 8px 6px 8px 8px; }
  .term .touch { inset: 0; z-index: 10; touch-action: none; }
  .term.own { overflow: hidden; }
  .term.own pre { display: none; }
  .term.own .xt, .term.own .touch { display: block; }
  .term .xterm .xterm-viewport { background: transparent !important; overflow: hidden; }
  .held { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; font-size: 13px; background: var(--chrome); border-bottom: 1px solid var(--edge); }
  .held[hidden] { display: none; }
  .held span { flex: 1; opacity: .75; }
  .held button { font-weight: 600; padding: 7px 12px; border-radius: 99px; background: var(--ov2); }
  .menu .size { display: flex; gap: 4px; }
  .menu .size button { width: 34px; min-height: 30px; justify-content: center; padding: 0; background: var(--ov); border-radius: 8px; font-weight: 600; }
  .keys { display: flex; gap: 5px; padding: 8px 8px; overflow-x: auto; scrollbar-width: none; background: var(--chrome);
    border-top: 1px solid var(--edge); }
  .keys::-webkit-scrollbar { display: none; }
  .k { flex: 1 0 auto; min-width: 34px; height: 38px; padding: 0 8px; border-radius: 10px; display: grid; place-items: center;
    background: var(--ov); color: inherit; font: 600 13px/1 var(--sans); }
  .k:active { background: var(--ov2); transform: scale(.95); }
  .k.on { background: var(--blue); color: #fff; }
  .k.num { background: color-mix(in srgb, var(--amber) 22%, transparent); color: var(--amber); }
  .k.sep { min-width: 1px; width: 1px; padding: 0; background: var(--edge); margin: 6px 2px; }
  .sdock { padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--chrome); }
  .sdock .compose { background: var(--ov); border-color: var(--edge); box-shadow: none; }
  .sdock .compose textarea { color: inherit; }
  .sdock .compose textarea::placeholder { color: currentColor; opacity: .4; }
  .sdock .send { background: var(--term-fg, #c0caf5); color: var(--term-bg, #1a1b26); }
  .kbd { flex: none; width: 36px; height: 36px; border-radius: 99px; display: grid; place-items: center; opacity: .75; }
  .kbd:active { background: var(--ov); }
  .live { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 6px 0 14px; border-radius: 24px; background: color-mix(in srgb, var(--blue) 22%, transparent); font-size: 14px; }
  .live span { flex: 1; }
  .live button { font-weight: 600; padding: 8px 12px; border-radius: 99px; background: var(--ov2); }
  .ghost { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
  .menu { position: absolute; right: 10px; top: calc(env(safe-area-inset-top) + 50px); z-index: 2; min-width: 220px; padding: 6px; border-radius: 14px;
    background: var(--chrome); border: 1px solid var(--edge); box-shadow: 0 12px 40px rgba(0,0,0,.28);
    transform-origin: top right; animation: pop .18s var(--out) both; }
  .menu[hidden] { display: none; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }
  .menu button, .menu label, .menu .mrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 42px; padding: 0 10px; border-radius: 9px; font-size: 14.5px; text-align: left; }
  .menu button:active { background: var(--ov); transform: none; }
  .menu select { appearance: none; -webkit-appearance: none; border: 0; background: var(--ov); color: inherit; font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 8px; max-width: 140px; }
  .menu hr { border: 0; height: 1px; background: var(--edge); margin: 4px 6px; }

  .icon { flex: none; width: 34px; height: 34px; border-radius: 99px; display: grid; place-items: center; color: var(--ink2); background: var(--raise); }
  .sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.28);
    animation: fade .2s var(--out) both; }
  .sheet[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } }
  .sheet .card { width: 100%; max-width: 640px; margin: 0 8px calc(8px + env(safe-area-inset-bottom)); padding: 8px 16px 14px; border-radius: 24px;
    background: var(--surface); box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: up .26s var(--out) both; }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } }
  .sheet .grab { width: 36px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 12px; }
  .sheet h3 { margin: 14px 2px 8px; font-size: 13px; font-weight: 600; color: var(--ink2); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; border-radius: 12px; background: var(--raise); }
  .seg button { height: 34px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--ink2); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 1px var(--hair); }
  .themes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .theme { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--raise); font-size: 13.5px; text-align: left; border: 1.5px solid transparent; }
  .theme[aria-pressed="true"] { border-color: var(--blue); }
  .swatch { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font: 700 11px/1 var(--mono); border: 1px solid var(--hair); }
  .sheet .done { display: block; width: 100%; height: 46px; margin-top: 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 15px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    .g.working i { animation: none; border-color: var(--blue); }
  }
</style>
</head>
<body>
<main class="home" id="home"></main>
<div class="dock" id="dock">
  <div id="toast"></div>
  <form class="compose" id="ask">
    <textarea id="askText" rows="1" placeholder="Ask your agents…" enterkeyhint="send" autocomplete="off"></textarea>
    <button class="send" id="askSend" type="submit" aria-label="Send" disabled>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
</div>

<div class="sheet" id="prefs" hidden>
  <div class="card" role="dialog" aria-label="Appearance">
    <div class="grab"></div>
    <h3>Appearance</h3>
    <div class="seg" id="appearance"></div>
    <h3>Terminal</h3>
    <div class="themes" id="themes"></div>
    <button class="done" id="prefsDone">Done</button>
  </div>
</div>

<section class="session" id="session" aria-hidden="true">
  <div class="bar">
    <button class="back" id="back" aria-label="Back">
      <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9 2 2 9l7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="title"><b id="sTitle"></b><span><span class="g" id="sGlyph"><i></i></span><span id="sStatus"></span></span></div>
    <button class="more" id="more" aria-label="More">
      <svg width="18" height="4" viewBox="0 0 18 4" fill="currentColor"><circle cx="2" cy="2" r="2"/><circle cx="9" cy="2" r="2"/><circle cx="16" cy="2" r="2"/></svg>
    </button>
  </div>
  <div class="menu" id="menu" hidden>
    <label>Theme <select id="theme"></select></label>
    <div class="mrow">Text size <span class="size"><button id="smaller" aria-label="Smaller">−</button><button id="larger" aria-label="Larger">+</button></span></div>
    <button id="fit">Fit whole width <span id="fitState"></span></button>
    <button id="copy">Copy screen</button>
    <hr>
    <button id="focus">Show in herdr on the Mac</button>
  </div>
  <div class="held" id="held" hidden><span>Your Mac's window has this terminal, at its size.</span><button id="take">Fit to phone</button></div>
  <div class="term" id="term"><pre id="screen"></pre><div class="xt" id="xt"></div><div class="touch" id="touch"></div></div>
  <div class="keys" id="keys"></div>
  <div class="sdock" id="sdock"></div>
  <textarea class="ghost" id="ghost" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Type into the terminal"></textarea>
</section>

<script>
(() => {
  // ---------- plumbing ----------
  const qs = new URLSearchParams(location.search);
  let token = qs.get("t") || "";
  try { if (token) localStorage.setItem("reflex.token", token); else token = localStorage.getItem("reflex.token") || ""; } catch (e) {}
  if (qs.get("t")) history.replaceState(null, "", location.pathname + location.hash);
  // A pairing link (?p=…) from "Take Reflex with you": its one-time code is
  // traded for the phone's token, and the link is spent.
  const pairCode = qs.get("p");
  let pairError = "";
  if (pairCode) history.replaceState(null, "", location.pathname + location.hash);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },

  const api = async (path, body) => {

  let state = null, offline = false;

  const leaf = (p) => (p || "").split("/").filter(Boolean).pop() || p || "";
  const word = { working: "Working", blocked: "Needs you", done: "Done", idle: "Idle" };

  const ago = (ms) => { const s = Math.max(0, Math.round(((state?.now ?? Date.now()) - ms) / 1000));
    return s < 10 ? "now" : s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m" : s < 86400 ? Math.floor(s / 3600) + "h" : Math.floor(s / 86400) + "d"; };

  // ---------- home ----------

  const asks = (i) => i.options && i.options.length;
  function renderHome() {
    const home = $("home");

    h += `</div>`;

    // Updates: what finished or answered while you were away.
    if (ups.length) {
      h += `<div class="section"><div class="label">Updates <span class="n">${ups.length}</span><button class="act" data-clearall>Clear</button></div><div class="group">`;

          ${glyph(bg ? (i.title.startsWith("needs") ? "blocked" : "done") : i.kind === "ready" || i.kind === "reply" ? "done" : "idle")}
          <div class="text"><div class="t1">${esc(i.agent)}</div><div class="t2">${esc(i.title)}</div>${g ? `<div class="gist">${esc(g)}</div>` : ""}</div>
          <span class="side">${ago(i.at)}</span>

    } else if (!qs.length && s.agents.length) {
      h += `<div class="section"><div class="group allclear">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="currentColor" stroke-width="1.6"/><path d="m6.5 11.2 3 3 6-6.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><b>All clear</b><span>Nothing needs you right now.</span></div></div></div>`;
    }

    const recent = s.receipts.slice(0, 4);
    if (recent.length) h += `<div class="section"><div class="label">Recently</div><div class="activity">${recent.map((r) =>
      `<div class="${r.ok ? "" : "bad"}">${esc(r.label.replace(/^→ /, ""))} · ${esc(r.detail)}</div>`).join("")}</div></div>`;

  }

  async function refresh() {
    if (!token) return renderHome();

    toast("Jev is choosing…", { sticky: true });
    try {

  // The appearance sheet.

    if (!t) return;

      state.inbox = state.inbox.filter(asks); renderHome(); for (const id of ids) await api("/api/dismiss", { item: id }); }
    else if (t.dataset.open) return openSession(t.dataset.open);
    refresh();
  });

  // ---------- a session ----------
  const THEMES = {
    "Tokyo Night": ["#1a1b26", "#c0caf5", "#15161e #f7768e #9ece6a #e0af68 #7aa2f7 #bb9af7 #7dcfff #a9b1d6 #414868 #f7768e #9ece6a #e0af68 #7aa2f7 #bb9af7 #7dcfff #c0caf5"],
    "Tokyo Night Storm": ["#24283b", "#c0caf5", "#1d202f #f7768e #9ece6a #e0af68 #7aa2f7 #bb9af7 #7dcfff #a9b1d6 #414868 #f7768e #9ece6a #e0af68 #7aa2f7 #bb9af7 #7dcfff #c0caf5"],
    "Tokyo Night Day": ["#e1e2e7", "#3760bf", "#e9e9ed #f52a65 #587539 #8c6c3e #2e7de9 #9854f1 #007197 #6172b0 #a1a6c5 #f52a65 #587539 #8c6c3e #2e7de9 #9854f1 #007197 #3760bf"],
    "Catppuccin Mocha": ["#1e1e2e", "#cdd6f4", "#45475a #f38ba8 #a6e3a1 #f9e2af #89b4fa #f5c2e7 #94e2d5 #bac2de #585b70 #f38ba8 #a6e3a1 #f9e2af #89b4fa #f5c2e7 #94e2d5 #a6adc8"],
    "Dracula": ["#282a36", "#f8f8f2", "#21222c #ff5555 #50fa7b #f1fa8c #bd93f9 #ff79c6 #8be9fd #f8f8f2 #6272a4 #ff6e6e #69ff94 #ffffa5 #d6acff #ff92df #a4ffff #ffffff"],
    "GitHub Light": ["#ffffff", "#1f2328", "#24292f #cf222e #116329 #4d2d00 #0969da #8250df #1b7c83 #6e7781 #57606a #a40e26 #1a7f37 #633c01 #218bff #a475f9 #3192aa #8c959f"],
  };
  // The page: System (the phone's setting), Light or Dark. The terminal: Auto
  // pairs with it (Tokyo Night by night, Tokyo Night Day by day), or one theme.

  let themeName = store.get("reflex.term", "Auto");

  const isDark = () => appearance === "dark" || (appearance === "system" && mq.matches);
  const termTheme = () => THEMES[themeName === "Auto" ? (isDark() ? "Tokyo Night" : "Tokyo Night Day") : themeName];
  const light = (hex) => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255 > 0.6; };

    applyTheme();
    renderPrefs();
  }
  function setThemeColor() {
    $("themeColor").content = open ? termTheme()[0] : (isDark() ? "#0c0c0d" : "#f4f4f5");
  }
  function renderPrefs() {
    $("appearance").innerHTML = [["system", "System"], ["light", "Light"], ["dark", "Dark"]]
      .map(([v, l]) => `<button data-appearance="${v}" aria-pressed="${appearance === v}">${l}</button>`).join("");
    const auto = THEMES[isDark() ? "Tokyo Night" : "Tokyo Night Day"];
    const tile = (name, t, label) => `<button class="theme" data-term="${esc(name)}" aria-pressed="${themeName === name}">
      <span class="swatch" style="background:${t[0]};color:${t[2].split(" ")[4]}">A</span><span>${esc(label)}</span></button>`;
    $("themes").innerHTML = tile("Auto", auto, "Auto") + Object.keys(THEMES).map((n) => tile(n, THEMES[n], n)).join("");
    $("theme").innerHTML = ["Auto", ...Object.keys(THEMES)].map((n) => `<option${n === themeName ? " selected" : ""}>${esc(n)}</option>`).join("");
  }
  mq.addEventListener("change", () => { if (appearance === "system") applyAppearance(); });
  // Wrap (readable, the default) or fit every column (for TUIs that need them).

  $("theme").onchange = (e) => setTerm(e.target.value);
  function applyTheme() {
    const t = termTheme(), el = $("session");

  }

  const xterm = (n, pal) => {
    if (n < 16) return pal[n];

  };
  // SGR colours to HTML; other escapes (cursor moves, modes) are dropped.
  function ansiHtml(text, theme) {
    const pal = theme[2].split(" ");
    let st = {}, out = "", last = 0;
    const span = (chunk) => {
      if (!chunk) return;
      let fg = st.fg, bg = st.bg;
      if (st.inv) [fg, bg] = [bg || theme[0], fg || theme[1]];
      const css = [fg && `color:${fg}`, bg && `background:${bg}`, st.bold && "font-weight:700", st.dim && "opacity:.6",

      const ps = (m[1] || "0").split(/[;:]/).map((x) => +x || 0);

        const c = ps[i];

        else if (c === 1) st.bold = 1; else if (c === 2) st.dim = 1; else if (c === 3) st.it = 1;
        else if (c === 4) st.ul = 1; else if (c === 7) st.inv = 1;
        else if (c === 22) st.bold = st.dim = 0; else if (c === 23) st.it = 0; else if (c === 24) st.ul = 0; else if (c === 27) st.inv = 0;
        else if (c >= 30 && c <= 37) st.fg = pal[c - 30]; else if (c >= 90 && c <= 97) st.fg = pal[c - 82];

      }

  }

  // Fit the terminal's columns to the phone's width (readable size otherwise).
  const charW = (() => { const c = document.createElement("canvas").getContext("2d"); c.font = "100px " + getComputedStyle(document.body).getPropertyValue("--mono");
    return c.measureText("MMMMMMMMMM").width / 1000; })();
  let cols = 80;
  function fitFont() {
    const w = $("term").clientWidth - 20;
    const size = fit ? Math.max(5.5, Math.min(13, w / (cols * charW))) : 11;
    $("screen").style.setProperty("--fs", size.toFixed(2) + "px");
    $("term").classList.toggle("fit", fit);
    $("fitState").textContent = fit ? "On" : "Off";
  }
  // Wrapped, a screen's padding and full-width rules would wrap into rows of
  // nothing: trailing spaces go, and a rule is cut to the phone's width.
  const ESC = /\x1b\[[0-9;?:]*[A-Za-z@]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)|\x1b[()][A-Za-z0-9]|\x1b[=>78]|\r/g;

    const width = Math.floor(($("term").clientWidth - 20) / (11 * charW));
    return text.split("\n").map((line) => {
      line = line.replace(/ +((?:\x1b\[[0-9;]*m)*)$/, "$1");
      const plain = line.replace(ESC, "");
      if (plain.length > width && /^[\s─━═—_\-]+$/.test(plain)) {
        let seen = 0, out = "";
        for (const part of line.split(/(\x1b\[[0-9;?:]*[A-Za-z@])/)) {
          if (part.startsWith("\x1b")) { out += part; continue; }
          const take = part.slice(0, Math.max(0, width - seen)); out += take; seen += take.length;
        }
        return out;
      }
      return line;
    }).join("\n");
  }

  // ---------- the phone's own size ----------
  // The phone sizes the terminal to itself (herdr's terminal session control,
  // through /api/term), so the agent lays out for it instead of wrapping.
  // xterm.js draws it cell by cell: wide characters, box drawing and blocks
  // drawn rather than borrowed from a font, symbols the font lacks scaled
  // into their cells. Swipes scroll through herdr: wheel events for an agent
  // in its own screen, herdr's scrollback for a shell. A terminal the Mac's
  // window holds keeps the Mac's size until you take it.
  const XT = ["xterm-6.0.0.js", "xterm-addon-webgl-0.19.0.js", "xterm-addon-unicode11-0.9.0.js", "xterm-addon-fit-0.11.0.js"];
  let xtLoad = null, xt = null, own = false, held = false, frame = "", shown = "";
  let fontSize = +store.get("reflex.fs", "12") || 12;
  const loadXterm = () => xtLoad ||= new Promise((done, fail) => {
    let left = XT.length + 1;
    const loaded = () => { if (!--left) done(); }, failed = (src) => () => { xtLoad = null; fail(new Error(src)); };
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "xterm-6.0.0.css";
    css.onload = loaded; css.onerror = failed(css.href); document.head.append(css);
    for (const src of XT) {
      const s = document.createElement("script"); s.src = src; s.onload = loaded; s.onerror = failed(src);
      document.head.append(s);
    }
  });
  const xtTheme = () => {
    const [bg, fg, p] = termTheme(), c = p.split(" ");
    const names = ["black", "red", "green", "yellow", "blue", "magenta", "cyan", "white"];
    const t = { background: bg, foreground: fg, cursor: fg, selectionBackground: fg + "40" };
    names.forEach((n, i) => { t[n] = c[i]; t["bright" + n[0].toUpperCase() + n.slice(1)] = c[i + 8]; });
    return t;
  };
  function makeXt() {
    const term = new Terminal({ fontFamily: 'ui-monospace, "SF Mono", Menlo, monospace', fontSize, lineHeight: 1.05, scrollback: 0,
      disableStdin: true, cursorBlink: false, allowProposedApi: true, customGlyphs: true, rescaleOverlappingGlyphs: true, theme: xtTheme() });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.loadAddon(new Unicode11Addon.Unicode11Addon());
    term.unicode.activeVersion = "11";
    term.open($("xt"));
    try { const gl = new WebglAddon.WebglAddon(); gl.onContextLoss(() => gl.dispose()); term.loadAddon(gl); } catch (e) {}
    // Typing goes through the ghost field; xterm's own never brings up a keyboard.
    if (term.textarea) { term.textarea.readOnly = true; term.textarea.tabIndex = -1; term.textarea.setAttribute("inputmode", "none"); }
    return { term, fit };
  }
  // The columns and rows that fit the phone now.
  const dims = () => { const d = xt && xt.fit.proposeDimensions(); return d && d.cols > 0 && d.rows > 0 ? d : null; };
  function setOwn(on, isHeld) {
    own = on; held = !on && !!isHeld;
    $("term").classList.toggle("own", own);
    $("held").hidden = !held;
    $("fit").hidden = own;
    frame = "";
    if (own) refit();   // the banner going changes the room
  }
  // Size the terminal to the phone (and scroll it): false once another client holds it.
  async function control(extra = {}, take = false) {
    const d = dims(); if (!open || !d) return false;
    if (d.cols !== xt.term.cols || d.rows !== xt.term.rows) xt.term.resize(d.cols, d.rows);
    let r;
    try { r = await api("/api/term", { pane: open, cols: d.cols, rows: d.rows, take: take ? "1" : "", ...extra }); } catch (e) { return own; }
    if (r.held) { setOwn(false, true); return false; }
    if (r.ok && !own) setOwn(true);
    return r.ok;
  }
  async function claim(take) {
    const pane = open;
    try { await loadXterm(); } catch (e) { return; }
    if (pane !== open) return;
    xt ||= makeXt();
    xt.term.write("\x1b[H\x1b[2J");
    if (take) $("held").hidden = true;
    $("term").classList.add("own");   // measured where it will show
    const ok = await control({}, take);
    if (pane !== open) return;
    if (!ok) $("term").classList.toggle("own", own);
    tick(true);
  }
  $("take").onclick = () => claim(true);
  // Draw herdr's screen as it is; a screen of another size means the terminal
  // went back to another client (the Mac's window took it).
  function paint(text) {
    const rows = text.replace(/\r/g, "").split("\n"), t = xt.term;
    const wide = rows.some((r) => [...r.replace(ESC, "")].length > t.cols);
    if (rows.length > t.rows || wide) { setOwn(false, true); return false; }
    const next = "\x1b[?25l\x1b[H\x1b[2J" + rows.map((r) => "\x1b[0m" + r).join("\r\n");
    if (next !== frame) { t.write(next); frame = next; }
    return true;
  }
  // Text size: the columns follow it.
  let refitTimer = null;
  function refit() {
    clearTimeout(refitTimer);
    refitTimer = setTimeout(() => {
      if (!own || !xt) return;
      const d = dims();
      if (d && (d.cols !== xt.term.cols || d.rows !== xt.term.rows)) control().then(() => tick(true));
    }, 180);
  }
  const resize = (by) => {
    fontSize = Math.max(8, Math.min(20, fontSize + by)); store.set("reflex.fs", String(fontSize));
    if (xt) { xt.term.options.fontSize = fontSize; refit(); }
  };
  $("smaller").onclick = () => resize(-1);
  $("larger").onclick = () => resize(1);

  // Swipes: a notch is about three rows of travel; a flick carries on a little.
  let owed = 0, scrolling = false, touch = null, glide = null;
  const notch = () => (xt ? 3 * ($("xt").clientHeight / xt.term.rows) : 48);
  async function flushScroll() {
    if (scrolling || !owed || !own) return;
    scrolling = true;
    const n = owed; owed = 0;
    await control({ scroll: n > 0 ? "up" : "down", n: Math.abs(n) });
    scrolling = false;
    soon();
    if (owed) flushScroll();
  }
  const move = (dy) => {
    touch.acc += dy;
    const step = notch();
    while (Math.abs(touch.acc) >= step) { const s = Math.sign(touch.acc); owed += s; touch.acc -= s * step; }
    flushScroll();
  };
  const tp = $("touch");
  tp.addEventListener("touchstart", (e) => {
    cancelAnimationFrame(glide);
    const y = e.touches[0].clientY;
    touch = { y, acc: 0, moved: 0, v: 0, t: e.timeStamp };
  }, { passive: true });
  tp.addEventListener("touchmove", (e) => {
    if (!touch) return;
    e.preventDefault();
    const y = e.touches[0].clientY, dy = y - touch.y, dt = Math.max(1, e.timeStamp - touch.t);
    touch.v = 0.7 * (dy / dt) + 0.3 * touch.v; touch.y = y; touch.t = e.timeStamp; touch.moved += Math.abs(dy);
    move(dy);
  }, { passive: false });
  tp.addEventListener("touchend", () => {
    if (!touch) return;
    if (touch.moved < 8) { touch = null; if (live) ghost.focus({ preventScroll: true }); return; }
    let v = touch.v, last = performance.now();
    const step = (now) => {
      v *= Math.pow(0.995, now - last); const dy = v * (now - last); last = now;
      if (Math.abs(v) < 0.05 || !touch) { touch = null; return; }
      move(dy); glide = requestAnimationFrame(step);
    };
    if (Math.abs(v) > 0.3) glide = requestAnimationFrame(step); else touch = null;
  });

  // Copy what is on screen (http on the tailnet has no async clipboard).
  $("copy").onclick = () => {
    $("menu").hidden = true;
    const text = shown.replace(ESC, "").replace(/\r/g, "").replace(/[ \t]+$/gm, "").replace(/\n+$/, "");
    const t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;opacity:0;top:0";
    document.body.append(t); t.select(); t.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    t.remove();
    if (!ok && navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast("Copied"), () => toast("Couldn't copy", { bad: true }));
    else toast(ok ? "Copied" : "Couldn't copy", { bad: !ok });
  };

  let open = null, timer = null, live = false, ctrl = false, busy = false;
  const agentOf = (pane) => state?.agents.find((a) => a.pane === pane);

  function renderSessionChrome() {
    const a = agentOf(open) || { kind: "terminal", cwd: "", status: "idle", title: "" };
    const s = norm(a.status);
    $("sTitle").textContent = a.title || (a.cwd ? `${a.kind} · ${leaf(a.cwd)}` : "Terminal");
    $("sGlyph").className = "g " + s;
    $("sStatus").textContent = [a.kind, leaf(a.cwd), word[s]].filter(Boolean).join(" · ");
    // The key bar: what a TUI needs that a phone keyboard lacks; answers when it asks.
    const nums = s === "blocked" ? ["1", "2", "3"].map((n) => `<button class="k num" data-k="${n}">${n}</button>`).join("") + `<span class="k sep"></span>` : "";
    const keys = nums + [["esc", "esc"], ["tab", "⇥"], ["up", "↑"], ["down", "↓"], ["left", "←"], ["right", "→"], ["enter", "⏎"], ["ctrl+c", "^C"], ["ctrl", "ctrl"]]
      .map(([k, l]) => `<button class="k${k === "ctrl" && ctrl ? " on" : ""}" data-k="${k}">${l}</button>`).join("");
    if ($("keys").dataset.sig !== keys) { $("keys").innerHTML = keys; $("keys").dataset.sig = keys; }
    const dock = live
      ? `<div class="live"><span>Typing into the terminal</span><button data-live>Done</button></div>`
      : `<form class="compose" id="msg"><textarea id="msgText" rows="1" placeholder="${agentOf(open) ? `Message ${esc(a.kind)}…` : "Run a command…"}" enterkeyhint="send" autocomplete="off"></textarea>
          <button class="kbd" type="button" data-live aria-label="Type into the terminal">
            <svg width="20" height="14" viewBox="0 0 20 14" fill="none"><rect x=".9" y=".9" width="18.2" height="12.2" rx="2.6" stroke="currentColor" stroke-width="1.5"/><path d="M4 4.5h1.5M8 4.5h1.5M12 4.5h1.5M16 4.5h0M4 7.5h1.5M8 7.5h1.5M12 7.5h1.5M6 10.3h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          <button class="send" type="submit" aria-label="Send" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>`;
    if ($("sdock").dataset.mode !== String(live)) { $("sdock").innerHTML = dock; $("sdock").dataset.mode = String(live); wireMessage(); }
    $("term").classList.toggle("typing", live);
  }

  function wireMessage() {
    const f = $("msg"); if (!f) return;
    const t = $("msgText"), b = f.querySelector(".send");
    t.addEventListener("input", () => { autosize(t); b.disabled = !t.value.trim(); });
    t.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); f.requestSubmit(); } });
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = t.value.trim(); if (!text) return;
      t.value = ""; autosize(t); b.disabled = true;
      const side = /^\/?btw\b/i.test(text);
      try { await api(side ? "/api/side" : "/api/send", { pane: open, text, label: "phone" }); } catch (err) {}
      soon();
    });
  }

  async function openSession(pane) {
    if (!pane) return;
    open = pane; live = false; ctrl = false;
    $("sdock").dataset.mode = "";
    renderSessionChrome();
    $("screen").innerHTML = "";
    $("session").classList.add("on"); $("session").setAttribute("aria-hidden", "false");
    setThemeColor();
    if (location.hash !== "#pane=" + encodeURIComponent(pane)) history.pushState({ pane }, "", "#pane=" + encodeURIComponent(pane));
    // Opening a session reads its notifications (Jev's routing questions stay).
    const ids = (state?.inbox || []).filter((i) => i.pane === pane && i.kind !== "route").map((i) => i.id);
    if (ids.length) { state.inbox = state.inbox.filter((i) => !ids.includes(i.id)); renderHome(); ids.forEach((id) => api("/api/dismiss", { item: id }).catch(() => {})); }
    pinned = true;
    setOwn(false); shown = "";
    tick();
    claim(false);
  }
  function closeSession(fromPop) {
    open = null; setLive(false);
    setOwn(false); owed = 0; touch = null; cancelAnimationFrame(glide);
    $("menu").hidden = true;
    $("session").classList.remove("on"); $("session").setAttribute("aria-hidden", "true");
    setThemeColor();
    clearTimeout(timer);
    if (!fromPop && location.hash.startsWith("#pane=")) history.back();
  }
  $("back").onclick = () => closeSession(false);
  window.addEventListener("popstate", () => { const m = /^#pane=(.+)$/.exec(location.hash); if (m) openSession(decodeURIComponent(m[1])); else if (open) closeSession(true); });

  let pinned = true;
  $("term").addEventListener("scroll", () => { const el = $("term"); pinned = el.scrollHeight - el.scrollTop - el.clientHeight < 30; }, { passive: true });
  async function tick(once) {
    if (!open || busy) return;
    busy = true;
    try {
      const t = own && xt ? xt.term : null;
      const r = await api("/api/pane?format=ansi&id=" + encodeURIComponent(open) + (t ? "&source=visible&lines=" + t.rows : "&lines=200"));
      const text = r.text || "";
      shown = text;
      if (!(t && r.ok && text && paint(text))) {
        const plain = text.replace(/\x1b\[[0-9;?:]*[A-Za-z@]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)|\x1b[()][A-Za-z0-9]|\x1b[=>78]|\r/g, "");
        cols = Math.min(240, Math.max(40, ...plain.split("\n").map((l) => l.replace(/\s+$/, "").length)));
        fitFont();
        $("screen").innerHTML = text ? ansiHtml(fit ? text : tidy(text), termTheme()) : `<span style="opacity:.5">${esc(r.error || "Nothing on screen yet.")}</span>`;
        if (pinned) $("term").scrollTop = $("term").scrollHeight;
      }
    } catch (e) {}
    busy = false;
    if (once !== true) { clearTimeout(timer); timer = setTimeout(tick, document.hidden ? 4000 : 600); }
  }
  // After a key or message, look again at once — the reply is what you want to see.
  function soon() { setTimeout(() => tick(true), 120); setTimeout(() => tick(true), 450); }

  // Keys and typed text go out in order, one at a time.
  let chain = Promise.resolve(), pendingText = "", textTimer = null;
  const send = (path, body) => { chain = chain.then(() => api(path, body).catch(() => {})).then(soon); };
  function key(k) {
    if (!open) return;
    flushText();
    send("/api/keys", { pane: open, key: k });
  }
  function typed(s) {
    if (!open || !s) return;
    if (ctrl && /^[a-z]$/i.test(s)) { ctrl = false; renderSessionChrome(); return key("ctrl+" + s.toLowerCase()); }
    pendingText += s;
    clearTimeout(textTimer); textTimer = setTimeout(flushText, 35);
  }
  function flushText() {
    clearTimeout(textTimer);
    if (!pendingText) return;
    const t = pendingText; pendingText = "";
    send("/api/text", { pane: open, text: t });
  }

  $("keys").addEventListener("click", (e) => {
    const b = e.target.closest("[data-k]"); if (!b) return;
    const k = b.dataset.k;
    if (k === "ctrl") { ctrl = !ctrl; renderSessionChrome(); if (!live) setLive(true); return; }
    if (/^[0-9]$/.test(k)) return typed(k);
    key(k);
    if (live) $("ghost").focus({ preventScroll: true });
  });
  // Keep the keyboard up while tapping keys.
  $("keys").addEventListener("pointerdown", (e) => { if (live) e.preventDefault(); });

  // Live typing: a hidden field takes the phone keyboard; every keystroke goes
  // to the terminal as it is typed. A two-space sentinel lets Backspace register.
  const ghost = $("ghost"), SENT = "  ";
  function setLive(on) {
    live = on; if (!on) ctrl = false;
    renderSessionChrome();
    if (on) { ghost.value = SENT; ghost.focus({ preventScroll: true }); ghost.setSelectionRange(2, 2); }
    else ghost.blur();
  }
  $("sdock").addEventListener("click", (e) => { if (e.target.closest("[data-live]")) setLive(!live); });
  $("term").addEventListener("click", () => { if (live) ghost.focus({ preventScroll: true }); });
  ghost.addEventListener("input", (e) => {
    const t = e.inputType || "";
    if (t === "deleteContentBackward") key("backspace");
    else if (t === "insertLineBreak" || t === "insertParagraph") key("enter");
    else if (e.data) typed(e.data);
    else { const v = ghost.value.replace(/^ {0,2}/, ""); if (v) typed(v); }
    ghost.value = SENT; ghost.setSelectionRange(2, 2);
  });
  ghost.addEventListener("keydown", (e) => {
    const map = { Enter: "enter", Tab: "tab", Escape: "esc", ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
    if (map[e.key]) { e.preventDefault(); key(map[e.key]); }
    else if (e.ctrlKey && /^[a-z]$/i.test(e.key)) { e.preventDefault(); key("ctrl+" + e.key.toLowerCase()); }
  });
  ghost.addEventListener("blur", () => { if (live) setTimeout(() => { if (live && document.activeElement !== ghost && !document.activeElement?.closest?.("#keys")) setLive(false); }, 250); });

  // Menu.
  $("more").onclick = (e) => { e.stopPropagation(); $("menu").hidden = !$("menu").hidden; };
  document.addEventListener("click", (e) => { if (!$("menu").hidden && !e.target.closest("#menu,#more")) $("menu").hidden = true; });
  $("fit").onclick = () => { fit = !fit; store.set("reflex.fit2", fit ? "1" : "0"); fitFont(); tick(true); };
  $("focus").onclick = () => { $("menu").hidden = true; api("/api/focus", { pane: open }); toast("Shown in herdr on your Mac"); };

  // The keyboard takes room: the session fits what is left of the screen.
  const vv = window.visualViewport;
  const fitViewport = () => { document.documentElement.style.setProperty("--vvh", (vv ? vv.height : innerHeight) + "px"); if (open) { fitFont(); refit(); if (pinned) $("term").scrollTop = $("term").scrollHeight; } };
  if (vv) { vv.addEventListener("resize", fitViewport); vv.addEventListener("scroll", () => window.scrollTo(0, 0)); }
  window.addEventListener("resize", fitViewport);
  fitViewport();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); if (open) { tick(true); claim(false); } } });

  applyAppearance();
  async function pair() {
    if (!pairCode) return;
    try {
      const r = await fetch("/api/pair", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: pairCode }) });
      const j = await r.json();
      if (j.ok && j.token) { token = j.token; store.set("reflex.token", token); }
      else if (!token) pairError = "used";
    } catch (e) { if (!token) pairError = "offline"; }
  }
  pair().then(refresh).then(() => { const m = /^#pane=(.+)$/.exec(location.hash); if (m && state) openSession(decodeURIComponent(m[1])); });
  setInterval(refresh, 1500);
})();
</script>
</body>
</html>
