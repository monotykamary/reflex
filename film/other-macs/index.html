<!doctype html>
<!-- Update film, Reflex 0.1.39–0.1.43: agents on your other Macs. 40.8 s on the
     launch film's clock (100 BPM; ../grid.js), over the second half of its
     score, so film t = launch t − 16.8 and the picture lands on its hits.
     See SPEC.md. The app's UI is rebuilt at its own sizes in pt and enlarged
     with `zoom`, so text stays sharp. -->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "SF"; src: url("assets/fonts/SFNS.ttf"); font-weight: 1 1000; }
      @font-face { font-family: "SF Mono"; src: url("assets/fonts/SFNSMono.ttf"); font-weight: 1 1000; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono.ttf"); font-weight: 100 900; }
      :root {
        --ground: #08090c;
        --ink: #ededef; --ink2: rgba(237,237,239,.62); --ink3: rgba(237,237,239,.36);
        --panel: #18191e; --line: rgba(255,255,255,.09);
        /* The app's Tone (Design.swift). */
        --working: #5c8cff; --blocked: #ffb021; --done: #40d187; --route: #9e7aff; --remote: #29b3c7;
        --sans: "SF", system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
      .ground { position: absolute; inset: 0; background: radial-gradient(1100px 760px at 50% 52%, #101218, var(--ground)); }

      /* Lines: words rise from behind a mask (the launch film's entrance). */
      .line { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: -.035em; white-space: nowrap; }
      .line .m { display: inline-block; overflow: hidden; vertical-align: top; padding: .3em .08em; margin: -.3em -.08em; }
      .line .w { display: inline-block; }
      .say { font-size: 64px; }
      .big { font-size: 128px; letter-spacing: -.045em; line-height: 1.05; }

      /* The app's surfaces, in pt (1 pt = 1 px before zoom). */
      .surface { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
      .ic { width: 1em; height: 1em; fill: currentColor; flex: none; }

      /* AgentGlyph: ring (working), dot (waiting, done), the remote badge on its shoulder. */
      .gl { position: relative; width: var(--s); height: var(--s); flex: none; }
      .gl svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .gl .dot { position: absolute; left: 19%; top: 19%; width: 62%; height: 62%; border-radius: 50%; }
      .gl .dot.wait { background: var(--blocked); }
      .gl .dot.done { background: var(--done); }
      .gl .dot.idle { left: 25%; top: 25%; width: 50%; height: 50%; background: rgba(255,255,255,.28); }
      .gl .badge { position: absolute; width: calc(var(--s) * .42); height: calc(var(--s) * .42); right: calc(var(--s) * -.16); top: calc(var(--s) * -.16);
        border-radius: 50%; background: var(--remote); box-shadow: 0 0 0 .8px var(--bgc, #18191e); }

      /* MachineChip. */
      .chip { display: inline-flex; align-items: center; gap: 3px; padding: 1.5px 5px; border-radius: 99px; font-size: 9.5px; font-weight: 600;
        color: var(--remote); background: rgba(41,179,199,.13); white-space: nowrap; }
      .chip .ic { font-size: 8px; }

      /* A key on the keyboard, pressed on its beat. */
      .key { position: absolute; min-width: 92px; height: 92px; padding: 0 26px; border-radius: 22px; display: grid; place-items: center;
        font: 600 40px var(--sans); color: var(--ink); background: #222329; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 5px 0 rgba(0,0,0,.6); }

      .cursor { position: absolute; width: 58px; height: 58px; left: 0; top: 0; }
    </style>
    <script>
      // Shared moves, so every scene speaks the same vocabulary (SPEC.md MOTION).
      window.RF = {
        // Words rise from behind their mask, 0.08 s apart.
        lineIn(tl, sel, t) {
          tl.fromTo(sel, { opacity: 1 }, { opacity: 1, duration: 0.01, immediateRender: false }, t);
          tl.fromTo(sel + " .w", { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "expo.out", stagger: 0.08 }, t);
        },
        // Out by a blur, word by word.
        lineOut(tl, sel, t) {
          tl.to(sel + " .w", { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in", stagger: 0.04 }, t);
        },
        // A key goes down on the beat and comes back.
        press(tl, sel, t) {
          tl.fromTo(sel, { opacity: 0, y: 14, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.25, ease: "back.out(1.6)" }, t - 0.3);
          tl.to(sel, { y: 5, boxShadow: "0 0 0 rgba(0,0,0,.6)", duration: 0.05, ease: "power2.in" }, t - 0.05);
          tl.to(sel, { y: 0, boxShadow: "0 5px 0 rgba(0,0,0,.6)", duration: 0.12, ease: "power2.out" }, t + 0.03);
        },
        // Working rings turn once every 0.9 s, as in the app.
        spin(tl, sel, from, to) {
          tl.fromTo(sel, { rotation: 0 }, { rotation: ((to - from) / 0.9) * 360, duration: to - from, ease: "none", transformOrigin: "50% 50%" }, from);
        },
        // Type a string into an element, one character at a time.
        type(tl, sel, text, t, per) {
          const o = { n: 0 };
          tl.fromTo(o, { n: 0 }, { n: text.length, duration: text.length * per, ease: "none",
            onUpdate: () => { document.querySelector(sel).textContent = text.slice(0, Math.round(o.n)); } }, t);
        },
      };
    </script>
  </head>
