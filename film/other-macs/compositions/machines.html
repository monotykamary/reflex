  <script>
    const tl = gsap.timeline({ paused: true });
    const RF = window.RF;
    // Camera: put point (px, py) of the view at (cx, cy), scaled by s.
    const cam = (px, py, s, cx = 960, cy = 460) => ({ x: cx - px * s, y: cy - py * s, scale: s, transformOrigin: "0 0" });
    // Window pt → view px: x = (328 + pt) * 1.3, y = (12 + pt) * 1.3.
    const at = (x, y) => [(328 + x) * 1.3, (12 + y) * 1.3];
    const HOME = cam(960, 460, 1);
    const ADD = cam(...at(525, 620), 1.55);
    const HERDR = cam(...at(525, 330), 1.55);
    const TILE = at(524.5, 120);           // the header tile, in view px
    const IRIS = [TILE[0], TILE[1] + 160]; // and on screen

    // 0: the teal flood closes onto the Machines tile.
    tl.fromTo("#mac-cam", HOME, { ...HOME, duration: 0.01 }, 0);
    tl.fromTo("#mac-iris", { clipPath: `circle(1400px at ${IRIS[0]}px ${IRIS[1]}px)` },
      { clipPath: `circle(36px at ${IRIS[0]}px ${IRIS[1]}px)`, duration: 0.45, ease: "power3.out" }, 0);
    tl.to("#mac-iris", { opacity: 0, duration: 0.12 }, 0.4);
    RF.lineIn(tl, "#mac-l1", 0.3);

    // To the Add a Mac row: type, Test, Add. Cursor positions are window pt.
    tl.to("#mac-cam", { ...ADD, duration: 0.6, ease: "power4.inOut" }, 0.3);
    tl.set("#mac-ph", { opacity: 0 }, 0.72);
    tl.set("#mac-caret", { opacity: 1 }, 0.72);
    RF.type(tl, "#mac-typed", "studio", 0.75, 0.035);
    tl.fromTo("#mac-cur", { opacity: 0, x: 560, y: 660 }, { opacity: 1, x: 560, y: 660, duration: 0.15 }, 0.55);
    tl.to("#mac-cur", { x: 683, y: 619, duration: 0.3, ease: "power3.inOut" }, 0.7);    // Test
    tl.to("#mac-test", { scale: 0.94, duration: 0.05, yoyo: true, repeat: 1 }, 0.92);
    tl.set("#mac-t1", { display: "none" }, 0.95); tl.set("#mac-t2", { display: "inline" }, 0.95);
    // 10.8 (1.2): the result, on the score's note.
    tl.set("#mac-t2", { display: "none" }, 1.2); tl.set("#mac-t1", { display: "inline" }, 1.2);
    tl.fromTo("#mac-r1", { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 1.2);
    tl.to("#mac-add", { opacity: 1, duration: 0.15 }, 1.2);
    tl.to("#mac-cur", { x: 742, y: 619, duration: 0.3, ease: "power3.inOut" }, 1.4);    // Add
    // 11.4 (1.8): Add, on the key tick.
    tl.to("#mac-add", { scale: 0.94, duration: 0.05, yoyo: true, repeat: 1 }, 1.75);
    tl.set("#mac-a1", { display: "none" }, 1.8); tl.set("#mac-a2", { display: "inline" }, 1.8);
    tl.to("#mac-cur", { opacity: 0, duration: 0.2 }, 2.0);

    // Up to From herdr: studio lands on 12.0 (2.4), connects on 12.6 (3.0).
    tl.to("#mac-cam", { ...HERDR, duration: 0.6, ease: "power4.inOut" }, 1.9);
    tl.to("#mac-empty", { opacity: 0, duration: 0.15 }, 2.3);
    tl.fromTo("#mac-row", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 2.4);
    tl.set("#mac-a2", { display: "none" }, 2.4); tl.set("#mac-a1", { display: "inline" }, 2.4);
    tl.set("#mac-r1", { opacity: 0 }, 2.4); tl.set("#mac-r2", { opacity: 1 }, 2.4);
    RF.spin(tl, "#mac-sync", 2.4, 3.0);
    tl.set("#mac-sync", { opacity: 0 }, 3.0);
    tl.fromTo("#mac-ok", { opacity: 1, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 3.0);
    tl.set("#mac-s1", { opacity: 0 }, 3.0); tl.set("#mac-s2", { opacity: 1 }, 3.0);
    tl.set("#mac-n4", { opacity: 0 }, 3.0); tl.set("#mac-n7", { opacity: 1 }, 3.0);

    // Back out, and away as ⌥ ⌥ comes.
    tl.to("#mac-cam", { ...HOME, duration: 0.6, ease: "power4.inOut" }, 3.5);
    RF.lineOut(tl, "#mac-l1", 4.25);
    tl.to("#mac-cam", { opacity: 0, filter: "blur(8px)", scale: 0.97, x: 960 * 0.03, y: 460 * 0.03, duration: 0.25, ease: "power2.in" }, 4.5);

    window.__timelines["machines"] = tl;
  </script>
